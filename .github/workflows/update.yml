name: Update Dashboard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Only one update runs at a time; a new one waits for the previous to finish (F-16)
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tradingview_ta

      - name: Run update script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Pick up any commits pushed while this run was working, then push (F-16)
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $attempt of 3) - retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 3 attempts."
          exit 1
